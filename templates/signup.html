<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUP Form</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div id="main">
        <div id="canvas">
            <div id="form-body">
                <h2>Register Form</h2>
                <div class="mb-3">
                    <label for="Input1" class="form-label">User Name</label>
                    <input type="text" class="form-control" id="Input1">
                </div>
                <div class="mb-3">
                    <label for="Input2" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Input2">
                </div>
                <div class="text-center">      
                    <input type="submit" class="btn btn-primary" value="register"><br>
                    Already registered? <a href="/template/login.html">Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
