{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="container mt-5">

    <h2>Register</h2>

    <form action="/register" method="POST">

        <div class="mb-3">
            <label>Username</label>
            <input
                type="text"
                name="username"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Register As</label>

            <select
                name="role"
                class="form-control">

                <option value="user">User (Trekker)</option>

                <option value="staff">Trek Staff</option>

            </select>

        </div>

        <button class="btn btn-primary">
            Register
        </button>

    </form>

</div>

{% endblock %}
