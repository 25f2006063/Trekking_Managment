{% extends "base.html" %}

{% block title %}
Add Trek
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Add Trek</h2>

    <form action="{{ url_for('add_trek') }}" method="POST">

        <div class="mb-3">

            <label>Trek Name</label>

            <input
                type="text"
                name="trek_name"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Location</label>

            <input
                type="text"
                name="location"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Difficulty</label>

            <select
                name="difficulty"
                class="form-control">

                <option value="Easy">Easy</option>
                <option value="Moderate">Moderate</option>
                <option value="Hard">Hard</option>

            </select>

        </div>

        <div class="mb-3">

            <label>Duration (Days)</label>

            <input
                type="number"
                name="duration"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Available Slots</label>

            <input
                type="number"
                name="available_slots"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>Start Date</label>

            <input
                type="date"
                name="start_date"
                class="form-control"
                required>

        </div>

        <div class="mb-3">

            <label>End Date</label>

            <input
                type="date"
                name="end_date"
                class="form-control"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary">

            Add Trek

        </button>

    </form>

</div>

{% endblock %}
