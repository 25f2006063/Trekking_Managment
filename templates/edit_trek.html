{% extends "base.html" %}

{% block title %}
Edit Trek
{% endblock %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Trek</h2>

    <form action="{{ url_for('edit_trek', trek_id=trek.id) }}" method="POST">

        <div class="mb-3">

            <label>Trek Name</label>

            <input
                type="text"
                name="trek_name"
                class="form-control"
                value="{{ trek.trek_name }}"
                required>

        </div>

        <div class="mb-3">

            <label>Location</label>

           <input
                type="text"
                name="location"
                class="form-control"
                value="{{ trek.location }}"
                required>

        </div>

        <div class="mb-3">

            <label>Difficulty</label>

            <select
                name="difficulty"
                class="form-control">

                <option value="Easy"
                {% if trek.difficulty == "Easy" %}selected{% endif %}>
                    Easy
                </option>

                <option value="Moderate"
                {% if trek.difficulty == "Moderate" %}selected{% endif %}>
                    Moderate
                </option>

                <option value="Hard"
                {% if trek.difficulty == "Hard" %}selected{% endif %}>
                    Hard
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label>Duration (Days)</label>

           <input
                type="number"
                name="duration"
                class="form-control"
                value="{{ trek.duration }}"
                required>

        </div>

        <div class="mb-3">

            <label>Available Slots</label>

           <input
                type="number"
                name="available_slots"
                class="form-control"
                value="{{ trek.available_slots }}"
                required>

        </div>

        <div class="mb-3">

            <label>Start Date</label>

            <input
                type="date"
                name="start_date"
                class="form-control"
                value="{{ trek.start_date }}"
                required>

        </div>

        <div class="mb-3">

            <label>End Date</label>

            <input
                type="date"
                name="end_date"
                class="form-control"
                value="{{ trek.end_date }}"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary">

            Update Trek

        </button>

    </form>

</div>

{% endblock %}
