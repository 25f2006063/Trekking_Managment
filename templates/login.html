{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center mt-5">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="text-center mb-4">
                    Welcome Back
                </h2>

                <form action="{{ url_for('login') }}" method="POST">

                    <div class="mb-3">

                        <label for="username"
                               class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Enter Username"
                            required>

                    </div>

                    <div class="mb-4">

                        <label for="password"
                               class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                            required>

                    </div>

                    <button
                        class="btn btn-success w-100"
                        type="submit">

                        Login

                    </button>

                </form>

                <p class="text-center mt-3">

                    Don't have an account?

                    <a href="{{ url_for('register') }}">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
