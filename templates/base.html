<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Trek Management
        {% endblock %}
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="/">
               Trek Management
            </a>
            <a class="navbar-brand"
               href="/">
               Home
            </a>
            <a class="navbar-brand"
               href="/">
               About
            </a>

        </div>

    </nav>

    <!-- Main Content -->

    <div class="container mt-4">

        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
